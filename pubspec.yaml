name: instacrop
description: A flutter plugin to crop image in instapicker package. Fork of insta_image_crop package.
version: 1.0.1
homepage: https://github.com/AyeshaIftikhar/instacrop.git
repository: https://github.com/AyeshaIftikhar/instacrop
topics:
  - instagram
  - crop
  - edit
  - picker

environment:
  sdk: ^3.5.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aishayy.instacrop
        pluginClass: InstacropPlugin
      ios:
        pluginClass: InstacropPlugin


funding: 
  - https://patreon.com/AyeshaIftikhar